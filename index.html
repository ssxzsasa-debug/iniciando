<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Uma Mensagem Especial 💖</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffe9f2,#fff5fa);
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
text-align:center;
max-width:500px;
animation:aparecer 1s;
z-index:2;
}

h1{
font-size:42px;
color:#ff4d88;
margin-bottom:15px;
}

p{
font-size:22px;
color:#555;
line-height:1.6;
}

button{
margin-top:25px;
padding:15px 30px;
border:none;
border-radius:30px;
background:#ff4d88;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#mensagem{
display:none;
margin-top:25px;
font-size:24px;
color:#ff2f72;
font-weight:bold;
animation:aparecer 1s;
}

@keyframes aparecer{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.coracao{
position:fixed;
top:-20px;
font-size:24px;
animation:cair linear infinite;
}

@keyframes cair{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="card">

<h1>🎉 Parabéns! 🎉</h1>

<p>
Hoje é um dia muito especial.<br><br>

Esperamos que você seja muito feliz e que todos os seus sonhos se realizem. 💖
</p>

<button onclick="mostrar()">
Clique aqui 💌
</button>

<div id="mensagem">
🥹 Nós te amamos muito!<br><br>
Vamos sentir muita saudade de você. 💕<br><br>
Nunca se esqueça do quanto você é especial para todos nós. ❤️
</div>

</div>

<script>

function mostrar(){
document.getElementById("mensagem").style.display="block";
}

function criarCoracao(){

const c=document.createElement("div");

c.className="coracao";

c.innerHTML=["💖","💕","💗","💞","❤️"][Math.floor(Math.random()*5)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(4+Math.random()*4)+"s";

c.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},8000);

}

setInterval(criarCoracao,250);

</script>

</body>
</html>
